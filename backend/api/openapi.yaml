openapi: 3.0.3
info:
  title: 在线考试平台 API
  version: 1.0.0
  description: 在线考试平台统一采用 `/api/v1` 前缀，响应格式为 `{code,message,data}`。
servers:
  - url: http://localhost:19502
    description: Docker Compose 暴露的后端端口

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, name, role]
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, teacher]
    Question:
      type: object
      properties:
        type:
          type: string
          enum: [single, multiple, true_false, fill_blank, short_answer]
        content:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              text:
                type: string
        answer: {}
        analysis:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        knowledge_point:
          type: string
        score:
          type: number

paths:
  /healthz:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
  /api/v1/auth/register:
    post:
      summary: 注册学生或教师账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
  /api/v1/auth/login:
    post:
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回 token 和用户信息
  /api/v1/questions:
    get:
      summary: 分页查询题库
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: difficulty
          schema:
            type: string
        - in: query
          name: knowledge_point
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        '200':
          description: 题目列表
    post:
      summary: 新建题目
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
      responses:
        '201':
          description: 创建成功
  /api/v1/exams:
    post:
      summary: 创建考试并自动组卷
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, duration_minutes, question_config]
              properties:
                title:
                  type: string
                duration_minutes:
                  type: integer
                total_score:
                  type: number
                question_config:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      count:
                        type: integer
                      score:
                        type: number
                      difficulty:
                        type: string
      responses:
        '201':
          description: 创建成功

  /api/v1/exams/{id}/regenerate:
    post:
      summary: 重新组卷（草稿考试替换草稿；已发布考试生成新草稿版本，发布后才生效）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: 已生成（新）草稿版本
        '409':
          description: 已存在待发布的草稿版本，重复/并发变更仅允许一次生效

  /api/v1/exams/{id}/versions:
    get:
      summary: 查看考试的全部试卷版本（含历史版本）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 版本列表（draft 待发布 / published 生效中 / archived 历史版本）

  /api/v1/exams/{id}/versions/{version_no}:
    get:
      summary: 查看指定版本元数据
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_no
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 版本详情
    delete:
      summary: 放弃待发布的草稿版本（已发布/历史版本不可删除）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已放弃

  /api/v1/exams/{id}/versions/{version_no}/questions:
    get:
      summary: 查看指定版本冻结的题目（题干、选项、分值、标准答案的快照）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_no
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 该版本冻结的试卷题目
